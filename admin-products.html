<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Products | XiQi Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="admin-layout"><aside class="admin-sidebar"><h2>XiQi Admin</h2><nav><a href="admin.html">Dashboard</a><a class="active" href="admin-products.html">Products</a><a href="admin-categories.html">Categories</a><a href="admin-videos.html">Factory Videos</a><a href="admin-inquiries.html">Inquiries</a></nav><a href="product.html">View Website</a><button id="logoutButton" type="button">Logout</button></aside><section class="admin-main"><header class="admin-page-header"><div><p>XiQi Technology</p><h1>Products</h1><span>Manage products, media and publishing status.</span></div></header><section class="admin-panel"><form id="productForm" class="product-form"><input type="hidden" name="id"><input type="hidden" name="current_image_url"><input type="hidden" name="current_video_url"><input type="hidden" name="current_gallery"><input type="hidden" name="remove_product_video"><div class="form-grid"><label>Product Name<input name="name" required></label><label>Category<select name="category" required disabled><option value="">请选择产品分类</option></select></label><label>Sort Order<input name="sort_order" type="number" value="0"></label><label>Status<select name="status"><option value="published">Published</option><option value="draft">Draft</option></select></label><label>Price<input name="price"></label><label>MOQ<input name="moq"></label><label>Material<input name="material"></label><label>Packaging<input name="packaging"></label><label>Lead Time<input name="lead_time"></label></div><label>Short Description<input name="short_desc"></label><label>Description<textarea name="description" rows="4"></textarea></label><label>Features<textarea name="features" rows="4"></textarea></label><label>Product Image<input id="imageFile" type="file" accept="image/*"></label><label>Product Gallery Upload<input id="galleryFiles" type="file" accept="image/*" multiple></label><div id="productGalleryList" class="gallery-manage-list"></div><label>Product Video Upload<input id="productVideoFile" type="file" accept="video/mp4,video/*"></label><div class="form-actions compact-actions"><button id="removeProductVideo" type="button" hidden>Delete Product Video</button><span id="productVideoStatus"></span></div><div class="form-actions"><button type="submit">Add Product</button><button id="cancelEdit" type="button" hidden>Cancel Edit</button><span id="formStatus"></span></div></form></section><section class="admin-panel"><div class="section-title"><p>Products List</p><button id="refreshProducts" type="button">Refresh</button></div><div id="productList" class="product-list"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script><script src="supabase-config.js"></script><script src="admin-auth.js"></script><script src="admin-managed-media.js"></script><script src="admin-image-upload.js"></script><script src="admin.js"></script><script src="media-fallback.js"></script></body></html>
