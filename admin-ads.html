<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>广告数据 | XiQi</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-ads.css"></head>
<body class="ads-page"><main class="admin-layout"><aside class="admin-sidebar"><h2>XiQi Technology</h2><nav><a href="admin.html" data-admin-nav hidden>后台概览</a><a href="admin-inquiries.html" data-admin-nav hidden>询盘</a><a href="admin-ads.html" class="active">广告数据</a></nav><button id="logoutButton">退出登录</button></aside>
<section class="admin-main ads-main"><header class="ads-heading"><div><h1>广告数据</h1><p class="ads-meta"><span id="coverage">数据覆盖日期：—</span><span id="updated">数据更新时间：—</span></p></div><a class="ads-button primary" href="admin-ads-import.html" id="import-link" hidden>更新数据 <span aria-hidden="true">↗</span></a></header>
<div class="ads-toolbar"><label id="account-wrap" hidden><span class="sr-only">广告账户</span><select id="account" aria-label="广告账户"></select></label><label><span class="sr-only">日期范围</span><select id="preset" aria-label="日期范围"><option value="latest">最近一次完整数据</option><option value="7">近7天</option><option value="30">近30天</option><option value="today">今天</option><option value="yesterday">昨天</option><option value="custom">自定义</option></select></label><span id="range-caption" class="ads-muted"></span><form id="custom-dates" class="ads-custom-dates" hidden><label>开始日期<input id="start" type="date" required></label><span>至</span><label>结束日期<input id="end" type="date" required></label><button type="submit">查看</button></form></div>
<p id="state" class="ads-state" role="status">正在读取广告数据…</p>
<section id="summary" class="ads-metrics" aria-label="广告概览"><article class="ads-metric"><p>展示次数</p><strong id="metric-impressions">—</strong></article><article class="ads-metric"><p>点击次数</p><strong id="metric-clicks">—</strong></article><article class="ads-metric"><p>点击率</p><strong id="metric-ctr">—</strong></article><article class="ads-metric"><p>广告转化数</p><strong id="metric-conversions">—</strong></article></section>
<section class="ads-panel"><div class="ads-section-heading"><h2>五国投放表现</h2><span class="ads-muted">系列目标国家</span></div><div class="ads-table"><table class="ads-country-table"><thead><tr><th>国家</th><th>投放状态</th><th>展示</th><th>点击</th><th>点击率</th><th>广告转化</th></tr></thead><tbody id="country-rows"></tbody></table></div></section>
<section id="trend-panel" class="ads-panel" hidden><h2>按日趋势</h2><div id="trend"></div></section>
<details id="more-data" class="ads-panel ads-disclosure"><summary>更多数据</summary><div class="ads-detail-controls"><select id="type" aria-label="详细报表类型"><option value="campaign">广告系列详情</option><option value="ads">广告</option><option value="keywords">关键词</option><option value="terms">搜索词</option><option value="countries">用户实际地理位置</option><option value="devices">设备</option><option value="daily">每日数据</option></select><input id="search" placeholder="搜索内容" aria-label="搜索内容"><button id="detail-load">查询</button><button id="export">导出明细</button></div><p id="detail-updated" class="ads-muted"></p><p id="detail-note" class="ads-muted"></p><div class="ads-table"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div id="pagination" class="ads-pagination" hidden><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></details>
<details class="ads-panel ads-disclosure" id="data-notes"><summary>数据说明</summary><p id="basis"></p><p>国家按已核实的广告系列 ID 对应目标投放国家，不代表用户实际位置。区间汇总仅支持完整覆盖范围，不拆分、不补零；有每日明细才展示趋势。</p><p>Google 搜索词可能受隐私门槛限制，不能代表全部搜索。广告转化不等于网站询盘，也不能据此推断单条询盘的关键词。</p><p id="unmapped-note" hidden></p></details>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script><script src="supabase-config.js"></script><script src="admin-auth.js"></script><script src="admin-ads-csv.js"></script></body></html>
